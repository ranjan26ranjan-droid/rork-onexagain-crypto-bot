<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Quantum Matrix Pro v6.8</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #141a24; padding: 15px; border-radius: 8px; border: 1px solid #222b3c; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #1c2433; border: 1px solid #222b3c; color: white; border-radius: 4px; }
        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #logs { background: #000; color: #00ff66; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; border: 1px solid #111; }
    </style>
</head>
<body>
    <h1>QUANTUM MATRIX PRO v6.8</h1>
    
    <div class="card">
        <h3>⚡ Trading Console</h3>
        <select id="broker"><option>Binance</option><option>XM</option><option>Deriv</option></select>
        <button style="background:#00b0ff" onclick="runAnalysis()">RUN ICT/NEWS ANALYSIS</button>
        <button id="botBtn" style="background:#ff4444" onclick="toggleBot()">BOT: OFF</button>
    </div>

    <div class="card">
        <h3>Execution</h3>
        <input id="price" placeholder="Entry Price">
        <button style="background:#00c853" onclick="executeTrade('BUY')">BUY</button>
        <button style="background:#ff4444" onclick="executeTrade('SELL')">SELL</button>
    </div>

    <div class="card">
        <h3>System Logs</h3>
        <div id="logs">System Initialized...</div>
    </div>

    <script>
        let botOn = false;
        function log(m) { document.getElementById('logs').innerHTML += "<br>> " + m; }
        
        function toggleBot() {
            botOn = !botOn;
            document.getElementById('botBtn').style.background = botOn ? '#00c853' : '#ff4444';
            document.getElementById('botBtn').innerText = botOn ? 'BOT: ACTIVE' : 'BOT: OFF';
            log(botOn ? "Bot Enabled." : "Bot Disabled.");
        }

        function runAnalysis() {
            log("Scanning ICT/News...");
            document.getElementById('price').value = "2345.50";
            log("Analysis Complete: Signal BUY detected.");
            if(botOn) executeTrade('BUY');
        }

        function executeTrade(type) {
            let b = document.getElementById('broker').value;
            log("EXECUTING " + type + " ON " + b.toUpperCase() + "...");
            alert("Order placed on " + b);
        }
    </script>
</body>
</html>
