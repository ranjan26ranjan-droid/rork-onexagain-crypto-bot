<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Quantum Matrix Pro | Advanced Trading Suite</title>
    <style>
        :root { --bg: #0b0e14; --success: #00c853; --danger: #ff4444; --accent: #00b0ff; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #141a24; padding: 20px; border-radius: 10px; border: 1px solid #222b3c; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #1c2433; border: 1px solid #222b3c; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #terminal { background: #000; color: #00ff66; padding: 15px; height: 200px; overflow-y: auto; font-family: monospace; border: 1px solid #111; }
    </style>
</head>
<body>
    <h1>QUANTUM MATRIX PRO v6.8</h1>
    <div class="grid">
        <div class="card">
            <h3>🤖 AI Strategy Core</h3>
            <select id="brokerSelect">
                <option value="binance">Binance Futures</option>
                <option value="xm">XM Forex (MT5)</option>
                <option value="deriv">Deriv (Binary)</option>
            </select>
            <button style="background:var(--accent)" onclick="runStrategy()">RUN AI ANALYSIS</button>
            <button id="botToggle" style="background:var(--danger)" onclick="toggleBot()">BOT: OFF (Click to Activate)</button>
            <div id="strategyOutput" style="margin-top:10px; color: yellow;">Status: Standby</div>
        </div>
        <div class="card">
            <h3>⚡ Execution Console</h3>
            <input id="price" placeholder="Entry Price">
            <input id="sl" placeholder="Stop Loss">
            <input id="tp" placeholder="Take Profit">
            <button style="background:var(--success)" onclick="placeOrder('BUY')">BUY / LONG</button>
            <button style="background:var(--danger)" onclick="placeOrder('SELL')">SELL / SHORT</button>
        </div>
    </div>
    <div class="card">
        <h3>System Logs</h3>
        <div id="terminal">System Initialized. Awaiting Strategy Execution...</div>
    </div>

<script>
    let isAutoBotOn = false;
    function log(msg) {
        let t = document.getElementById('terminal');
        t.innerHTML += "<br>> " + msg;
        t.scrollTop = t.scrollHeight;
    }
    function toggleBot() {
        isAutoBotOn = !isAutoBotOn;
        let btn = document.getElementById('botToggle');
        btn.style.background = isAutoBotOn ? 'var(--success)' : 'var(--danger)';
        btn.innerText = isAutoBotOn ? 'BOT: ACTIVE' : 'BOT: OFF';
        log(isAutoBotOn ? "Auto-Execution Enabled." : "Auto-Execution Disabled.");
    }
    function runStrategy() {
        let broker = document.getElementById('brokerSelect').value;
        log("Analyzing market for " + broker.toUpperCase() + "...");
        log("ICT Fair Value Gap identified.");
        log("Elliott Wave sequence: Wave 5 detected.");
        document.getElementById('price').value = "2345.50";
        document.getElementById('sl').value = "2330.50";
        document.getElementById('tp').value = "2390.50";
        document.getElementById('strategyOutput').innerText = "ACTION: BUY | CONFIDENCE: 92%";
        if (isAutoBotOn) { placeOrder('BUY'); }
    }
    function placeOrder(type) {
        let b = document.getElementById('brokerSelect').value;
        log("ORDER EXECUTED: " + type + " on " + b.toUpperCase());
        alert("Order placed successfully on " + b);
    }
</script>
</body>
</html>
